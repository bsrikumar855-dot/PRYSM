name: images

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing via GitHub OIDC (public Sigstore)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, dockerfile: infra/docker/node.Dockerfile, target: service, app: api }
          - { name: gateway, dockerfile: infra/docker/node.Dockerfile, target: service, app: gateway }
          - { name: workers, dockerfile: infra/docker/node.Dockerfile, target: service, app: workers }
          - { name: web, dockerfile: infra/docker/node.Dockerfile, target: web, app: '' }
          - { name: db-migrate, dockerfile: infra/docker/node.Dockerfile, target: migrate, app: '' }
          - { name: ai-service, dockerfile: infra/docker/python.Dockerfile, target: '', app: '' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: APP=${{ matrix.app }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/prysm-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/prysm-${{ matrix.name }}:main
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: v3.1.3 }
      - name: Sign by digest (keyless)
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/prysm-${{ matrix.name }}@${{ steps.build.outputs.digest }}"
