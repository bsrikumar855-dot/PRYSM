packages:
  - apps/*
  - packages/*

saveExact: true
engineStrict: true
# Supply chain: don't resolve versions published less than a day ago; build scripts need explicit approval.
minimumReleaseAge: 1440
strictDepBuilds: true
allowBuilds:
  esbuild: true # postinstall verifies the platform-native binary it runs; widely used, needed by drizzle-kit and vite
  protobufjs: false # postinstall only checks CLI deps; runtime needs no build
