# Local development stack. Dev-only credentials; every port binds to 127.0.0.1.
#   pnpm infra:up     -> infrastructure only (run services with `pnpm dev`)
#   pnpm stack:up     -> infrastructure + all services in containers (profile "app")
name: prysm-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-dev-only
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d prysm']
      interval: 2s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    command: ['valkey-server', '--appendonly', 'yes', '--appendfsync', 'everysec', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['valkey-data:/data']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-s3.config=/etc/seaweedfs/s3.json']
    ports: ['127.0.0.1:8333:8333']
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz']
      interval: 2s
      retries: 60

  # One-shot: creates the evidence bucket with Object Lock (ADR-0011) using the admin identity.
  seaweedfs-init:
    image: amazon/aws-cli:2.37.8@sha256:420ab345e847291b541b45d989535f55bcff957c27fa1100fae4aa233e86398c
    depends_on:
      seaweedfs: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: prysm-admin
      AWS_SECRET_ACCESS_KEY: prysm-admin-dev-only
      AWS_REGION: us-east-1
    entrypoint: ['bash', '-c']
    command:
      - >-
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket prysm-evidence-dev 2>/dev/null ||
        aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket prysm-evidence-dev --object-lock-enabled-for-bucket
    restart: 'no'

  otel-lgtm:
    image: grafana/otel-lgtm:0.34.0@sha256:b966ea107831d526d9eb8fe4d2d86c9e5731392fad9dce8296bcf2072031f07c
    ports:
      - '127.0.0.1:3000:3000' # Grafana
      - '127.0.0.1:3100:3100' # Loki query API (used by scripts/verify-m0.mjs)
      - '127.0.0.1:3200:3200' # Tempo query API (used by scripts/verify-m0.mjs)
      - '127.0.0.1:4317:4317' # OTLP gRPC
      - '127.0.0.1:4318:4318' # OTLP HTTP
    volumes: ['lgtm-data:/data']

  # ---- profile "app": every service in a container (pnpm stack:up) ----
  db-migrate:
    profiles: [app]
    build: { context: ../.., dockerfile: infra/docker/node.Dockerfile, target: migrate }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL_OWNER: postgres://prysm_owner:prysm-owner-dev-only@postgres:5432/prysm
    restart: 'no'

  api:
    profiles: [app]
    build: { context: ../.., dockerfile: infra/docker/node.Dockerfile, target: service, args: { APP: api } }
    depends_on: &needs-db
      db-migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    environment:
      <<: &node-env
        DATABASE_URL_APP: postgres://prysm_app:prysm-app-dev-only@postgres:5432/prysm
        VALKEY_URL: redis://valkey:6379
        OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
        OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
        OTEL_TRACES_EXPORTER: otlp
        OTEL_METRICS_EXPORTER: otlp
        OTEL_LOGS_EXPORTER: otlp
      SERVICE_NAME: api
      OTEL_SERVICE_NAME: prysm-api
      PORT: '4000'
    ports: ['127.0.0.1:4000:4000']
    healthcheck: &node-health
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:$${PORT}/readyz']
      interval: 3s
      retries: 40

  gateway:
    profiles: [app]
    build: { context: ../.., dockerfile: infra/docker/node.Dockerfile, target: service, args: { APP: gateway } }
    depends_on:
      valkey: { condition: service_healthy }
    environment:
      <<: *node-env
      SERVICE_NAME: gateway
      OTEL_SERVICE_NAME: prysm-gateway
      PORT: '4100'
    ports: ['127.0.0.1:4100:4100']
    healthcheck: *node-health

  workers:
    profiles: [app]
    build: { context: ../.., dockerfile: infra/docker/node.Dockerfile, target: service, args: { APP: workers } }
    depends_on:
      <<: *needs-db
      seaweedfs-init: { condition: service_completed_successfully } # evidence bucket (ADR-0011)
    environment:
      <<: *node-env
      SERVICE_NAME: workers
      OTEL_SERVICE_NAME: prysm-workers
      PORT: '4200'
    ports: ['127.0.0.1:4200:4200']
    healthcheck: *node-health

  web:
    profiles: [app]
    build: { context: ../.., dockerfile: infra/docker/node.Dockerfile, target: web }
    depends_on:
      api: { condition: service_healthy }
    environment:
      <<: *node-env
      API_URL: http://api:4000
      OTEL_SERVICE_NAME: prysm-web
    ports: ['127.0.0.1:3001:3001']
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3001/readyz']
      interval: 3s
      retries: 40

  ai-service:
    profiles: [app]
    build: { context: ../.., dockerfile: infra/docker/python.Dockerfile }
    environment:
      SERVICE_NAME: ai-service
      OTEL_SERVICE_NAME: prysm-ai-service
      PORT: '8000'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: 'true'
      OTEL_PYTHON_DISABLED_INSTRUMENTATIONS: fastapi # app instruments itself with query redaction
    ports: ['127.0.0.1:8000:8000']
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)",
        ]
      interval: 3s
      retries: 40

volumes:
  pg-data: {}
  valkey-data: {}
  seaweedfs-data: {}
  lgtm-data: {}
